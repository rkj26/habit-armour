name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # macOS on purpose: this app shells out to osascript/ioreg and imports
    # pyobjc, so a Linux runner would be testing something that can't exist.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: make install

      - name: Lint (ruff + oxlint)
        run: make lint

      - name: CSS token check
        run: make tokens

      - name: Tests
        run: make test

      - name: Client build
        run: make build
